  """
  pregame_hero_id: Int
  items: [Item!]
  stats: [Stat!]
  death_details: JsonScalar
  accolades: JsonScalar
  book_reward: JsonScalar
  power_up_buffs: JsonScalar
  ability_stats: JsonScalar
  player_tracked_stats: JsonScalar
  stats_type_stat: JsonScalar
