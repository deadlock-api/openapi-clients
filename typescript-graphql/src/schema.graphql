"""
Filter input for the `matches` and (transitively) `match_players` queries.
All listed columns are filterable. Operations across fields are AND-ed.
"""
input MatchPlayerWhere {
  match_id: U64Filter
  account_id: U32Filter
  hero_id: U32Filter
  player_slot: U32Filter
  team: StringFilter
  start_time: I64Filter
  duration_s: U32Filter
  match_mode: StringFilter
  game_mode: StringFilter
  winning_team: StringFilter
  match_outcome: StringFilter
  average_badge_team_0: U32Filter
  average_badge_team_1: U32Filter
  average_badge: U32Filter
  is_high_skill_range_parties: BoolFilter
  low_pri_pool: BoolFilter
  new_player_pool: BoolFilter
  not_scored: BoolFilter
  rewards_eligible: BoolFilter
  kills: U32Filter
  deaths: U32Filter
  assists: U32Filter
  net_worth: U32Filter
  player_level: U32Filter
  assigned_lane: U32Filter
}

enum OrderByMatch {
  MATCH_ID
  START_TIME
  AVERAGE_BADGE
}

enum OrderByMatchHistory {
  MATCH_ID
  ACCOUNT_ID
  START_TIME
}

enum OrderByMatchPlayer {
  MATCH_ID
  ACCOUNT_ID
  START_TIME
}

enum OrderDirection {
  DESC
  ASC
}

type QueryRoot {
  """Match-grouped query — one node per match_id with players aggregated."""
  matches(where: MatchPlayerWhere, order_by: OrderByMatch, order_direction: OrderDirection, limit: Int! = 100, offset: Int! = 0): [Match!]!

  """Player-row query — one node per (match_id, account_id)."""
  match_players(where: MatchPlayerWhere, order_by: OrderByMatchPlayer, order_direction: OrderDirection, limit: Int! = 100, offset: Int! = 0): [MatchPlayer!]!

  """
  Player match history — one node per (account_id, match_id), from the
  stored `player_match_history` table (no on-demand Steam fetch).
  """
  match_history(where: MatchHistoryWhere, order_by: OrderByMatchHistory, order_direction: OrderDirection, limit: Int! = 100, offset: Int! = 0): [MatchHistoryEntry!]!

  """
  All heroes for the given client version (defaults to latest), localized
  to `language` (defaults to English). Sourced from the versioned assets,
  not ClickHouse.
  """
  heroes(client_version: Int, language: Language): [Hero!]!

  """
  All items (abilities, weapons, upgrades) for the given client version
  (defaults to latest), localized to `language` (defaults to English).
  """
  items(client_version: Int, language: Language): [AssetItem!]!

  """
  All rank tiers for the given client version (defaults to latest),
  localized to `language` (defaults to English).
  """
  ranks(client_version: Int, language: Language): [Rank!]!
}

