"""
One `player_match_history` row per (`account_id`, `match_id`) — the same
data as the REST `/v1/players/{account_id}/match-history` endpoint, minus
the on-demand Steam fetch (only what `ClickHouse` has stored).
"""
type MatchHistoryEntry {
  account_id: Int
  match_id: Int

  """See more: <https://api.deadlock-api.com/v1/assets/heroes>"""
  hero_id: Int
  hero_level: Int
  start_time: Int
  game_mode: String
  match_mode: String
  player_team: String
  player_kills: Int
  player_deaths: Int
  player_assists: Int
  denies: Int
  net_worth: Int
  last_hits: Int
  team_abandoned: Boolean
  abandoned_time_s: Int
  match_duration_s: Int

  """The winning team id."""
  match_result: Int
  objectives_mask_team_0: Int
  objectives_mask_team_1: Int
  brawl_score_team_0: Int
  brawl_score_team_1: Int
  brawl_avg_round_time_s: Int
  won: Boolean

  """How the match was scored for the player."""
  player_match_outcome: String

  """
  The ranked badge shown for the player after the match (tier = first digits, subtier = last digit), capped at Eternus 6. See more: <https://api.deadlock-api.com/v1/assets/ranks>
  """
  ranked_display_badge: Int

  """The ranked progress change the player got from this match."""
  ranked_delta: Int

  """
  Non-zero if this match counted towards the player's ranked calibration.
  """
  ranked_calibration_match: Int

  """
  Whether the player's demotion protection absorbed a loss in this match.
  """
  ranked_used_demotion_protection: Boolean

  """
  Hero asset metadata for this entry's `hero_id` (latest version, English).
  """
  hero: Hero
}

"""
Filter input for the `match_history` query. Operations across fields are AND-ed.
"""
input MatchHistoryWhere {
  account_id: U32Filter
  match_id: U64Filter
  hero_id: U32Filter
  hero_level: U32Filter
  start_time: I64Filter
  game_mode: StringFilter
  match_mode: StringFilter
  player_team: StringFilter
  player_kills: U32Filter
  player_deaths: U32Filter
  player_assists: U32Filter
  denies: U32Filter
  net_worth: U32Filter
  last_hits: U32Filter
  team_abandoned: BoolFilter
  match_duration_s: U32Filter
  match_result: U32Filter
  won: BoolFilter
  player_match_outcome: StringFilter
  ranked_display_badge: U32Filter
  ranked_delta: I32Filter
  ranked_calibration_match: U32Filter
  ranked_used_demotion_protection: BoolFilter
}

